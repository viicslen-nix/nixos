# Portable, plugin-free tmux config for non-NixOS servers (tmux >= 3.2).
# Install: just tmux-push <user@host>
# Per-host overrides go in ~/.config/tmux/local.conf (e.g. set -g @server_name web-1).

#--------------------------------------------------------------------------
# General
#--------------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB:clipboard:usstyle:focus:title'

set -s escape-time 1
set -s focus-events on
set -s extended-keys on
set -s set-clipboard on

set -g mouse on
set -g history-limit 50000
set -g display-time 2000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-titles on
set -g set-titles-string '#{?@server_name,#{@server_name},#h}: #S'

setw -g mode-keys vi
setw -g monitor-activity on
set -g bell-action any
set -g visual-bell off
set -g visual-activity off

setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

#--------------------------------------------------------------------------
# Key bindings (prefix stays C-b so it doesn't clash with a local tmux)
#--------------------------------------------------------------------------

bind r source-file ~/.config/tmux/tmux.conf \; display 'tmux.conf reloaded'

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind C-p previous-window
bind C-n next-window
bind -r < swap-window -t -1
bind -r > swap-window -t +1
bind Space last-window
bind ^ switch-client -l

bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

#--------------------------------------------------------------------------
# Theme (Catppuccin Mocha, flat; status on top to stand apart from a local tmux)
#--------------------------------------------------------------------------

set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=default,fg=#a6adc8'
set -g status-left-length 40
set -g status-right-length 60

set -g status-left '#[fg=#11111b,bold,bg=#{?client_prefix,#fab387,#{?pane_in_mode,#f9e2af,#cba6f7}}] #S #[default] '
set -g status-right '#{?client_prefix,#[fg=#fab387 bold]PREFIX ,}#{?pane_in_mode,#[fg=#f9e2af bold]COPY ,}#[fg=#6c7086]%H:%M #[fg=#11111b,bg=#89b4fa,bold] #{?@server_name,#{@server_name},#h} '

setw -g window-status-format '#[fg=#6c7086] #I #[fg=#a6adc8]#W#{?window_zoomed_flag, (z),} '
setw -g window-status-current-format '#[fg=#cba6f7,bg=#313244,bold] #I #[fg=#cdd6f4]#W#{?window_zoomed_flag, (z),} '
setw -g window-status-separator ''
setw -g window-status-activity-style 'fg=#fab387'
setw -g window-status-bell-style 'fg=#f38ba8,bold'

set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#cba6f7'
set -g pane-border-lines single
set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g message-command-style 'bg=#313244,fg=#cdd6f4'
setw -g mode-style 'bg=#45475a,fg=#cdd6f4'
setw -g clock-mode-colour '#cba6f7'

source -q ~/.config/tmux/local.conf
