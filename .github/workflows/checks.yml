name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast gate: treefmt (deadnix/statix/alejandra/shfmt) and the pre-commit
  # hooks. These are the flake's own checks, so CI and local
  # `nix flake check` agree.
  format-and-lint:
    runs-on: ubuntu-latest
    name: Format & lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Nix Build Environment
        uses: ./.github/actions/setup-nix-build

      - name: treefmt + pre-commit
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.treefmt \
            .#checks.x86_64-linux.pre-commit

  # Fast evaluation gate for each evaluable host: prove the toplevel evaluates
  # to a derivation without building it, so this stays cheap and gives quick PR
  # feedback.
  #
  # wsl and lenovo-legion-go are excluded (pre-existing eval failures). Targets
  # the check attrs directly rather than `nix flake check`, which would evaluate
  # every nixosConfiguration.
  eval-hosts:
    runs-on: ubuntu-latest
    name: Eval ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host:
          - dostov-dev
          - home-desktop
          - asus-zephyrus-gu603
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Create token for the private work input
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: work
          permission-contents: read

      - name: Setup Nix Build Environment
        uses: ./.github/actions/setup-nix-build
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Evaluate host toplevel
        run: |
          nix eval --raw \
            .#checks.x86_64-linux.host-${{ matrix.host }}.drvPath
