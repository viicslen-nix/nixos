name: Cache

on:
  push:
    branches: [main]
    # Skip pushes that cannot change what hosts build: docs and the other workflows.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!.github/**'
      - '.github/cache-allowlist'
      - '.github/scripts/**'
      - '.github/actions/**'
      - '.github/workflows/cache.yml'
  workflow_dispatch:

# Let a running build finish; only the newest pending run is kept.
concurrency:
  group: cache
  cancel-in-progress: false

env:
  CACHIX_CACHE: viicslen-nix
  # The flake's nixConfig mirrors caches.nix, so dry-runs see what hosts can substitute.
  NIX_CONFIG: accept-flake-config = true

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    name: Build & push allowlisted paths
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Create token for the private work input
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: work
          permission-contents: read

      - name: Setup Nix Build Environment
        id: setup
        uses: ./.github/actions/setup-nix-build
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Setup Cachix (${{ env.CACHIX_CACHE }})
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The script pushes allowlisted closures only; the post-job push would upload everything built.
          skipPush: true

      # Hosts that evaluate (see parts/checks.nix); one job so shared derivations build once.
      - name: Build and push
        run: |
          .github/scripts/cache.sh "$CACHIX_CACHE" \
            dostov-dev \
            home-desktop \
            asus-zephyrus-gu603

      # The one writer of the input cache: the dry-runs above fetch every host's inputs.
      - name: Save flake inputs
        if: always() && steps.setup.outputs.input-cache-hit != 'true' && steps.setup.outputs.input-cache-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/nix
            !~/.cache/nix/eval-cache-*
          key: ${{ steps.setup.outputs.input-cache-key }}
