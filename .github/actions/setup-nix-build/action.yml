name: 'Setup Nix Build Environment'
description: 'Sets up Nix with flakes and Cachix, and restores the cached flake inputs'
inputs:
  cachix-auth-token:
    description: 'Cachix authentication token'
    required: false
    default: ''
  github-token:
    description: 'Token nix uses for github.com fetches; defaults to the workflow token'
    required: false
    default: ''
  free-disk-space:
    description: "'true' to delete preinstalled toolchains first (2-8 min); only full host builds need the room"
    required: false
    default: 'false'
outputs:
  input-cache-key:
    description: 'Exact key for the flake input cache; pass it to actions/cache/save'
    value: ${{ steps.inputs.outputs.cache-primary-key }}
  input-cache-hit:
    description: "'true' when the input cache matched exactly, so there is nothing new to save"
    value: ${{ steps.inputs.outputs.cache-hit }}
runs:
  using: 'composite'
  steps:
    - name: Free Disk Space (Ubuntu)
      if: inputs.free-disk-space == 'true'
      uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0

    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ inputs.github-token || github.token }}

    - name: Setup Cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: nix-community
        authToken: ${{ inputs.cachix-auth-token }}

    # Restore only: the Cache workflow, which fetches every host's inputs, is the one writer.
    - name: Restore flake inputs
      id: inputs
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/nix
          !~/.cache/nix/eval-cache-*
        key: nix-inputs-${{ runner.os }}-${{ hashFiles('flake.lock', 'flakes/*/flake.lock') }}
        restore-keys: nix-inputs-${{ runner.os }}-
