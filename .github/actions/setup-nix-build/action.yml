name: 'Setup Nix Build Environment'
description: 'Sets up Nix with flakes, Cachix, and frees up disk space for building'
inputs:
  cachix-auth-token:
    description: 'Cachix authentication token'
    required: false
    default: ''
  github-token:
    description: 'Token nix uses for github.com fetches; defaults to the workflow token'
    required: false
    default: ''
runs:
  using: 'composite'
  steps: 
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0

    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ inputs.github-token || github.token }}

    - name: Setup Cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: nix-community
        authToken: ${{ inputs.cachix-auth-token }}